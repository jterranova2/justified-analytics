<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justified Analytics</title>
<meta name="description" content="Reports people trust, with AI on top. A data and AI studio for operations-heavy businesses.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  :root {
    --bg: #f2f3f1; --ink: #111518; --muted: #586269; --rule: #d4d9db; --accent: #2443c4;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1214; --ink: #e6e9ea; --muted: #949ea5; --rule: #2b3236; --accent: #8ea4ff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .page { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); width: 100%; padding: 32px clamp(20px, 6vw, 88px); max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; }
  .brand svg { width: 18px; height: 18px; fill: var(--ink); }
  .brand .acc { fill: var(--accent); }
  main { align-self: center; padding: 12vh 0; max-width: 820px; }
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 22px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 7vw, 76px); line-height: 1.04; letter-spacing: -.015em; margin: 0; text-wrap: balance; max-width: 13em; }
  .lede { font-size: clamp(17px, 2vw, 19px); line-height: 1.55; color: var(--muted); margin: 26px 0 0; max-width: 30em; }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; border-top: 1px solid var(--rule); padding-top: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="0" y="1" width="18" height="2.4"/><rect x="0" y="5.6" width="18" height="2.4"/><rect x="0" y="10.2" width="18" height="2.4"/><rect class="acc" x="0" y="14.8" width="10" height="2.4"/></svg>
    Justified Analytics
  </header>
  <main>
    <p class="kicker">Data and AI studio for operations</p>
    <h1>Reports people trust, with AI on top.</h1>
    <p class="lede">For manufacturers, logistics and field-service businesses whose numbers live in too many places.</p>
  </main>
  <footer>
    <span>&copy; <span id="y">2026</span> Justified Analytics</span>
    <span>More here soon</span>
  </footer>
</div>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
